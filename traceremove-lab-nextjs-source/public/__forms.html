<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Traceremove form registry</title></head>
  <body>
    <form name="institutional-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="institutional-enquiry">
      <input type="hidden" name="subject">
      <input type="hidden" name="source">
      <input name="bot-field">
      <input name="enquiry_type">
      <input name="name">
      <input name="work_email" type="email">
      <input name="organisation">
      <textarea name="system_purpose"></textarea>
      <textarea name="decision_context"></textarea>
      <textarea name="affected_people"></textarea>
      <input name="deployment_stage">
      <input name="deadline" type="date">
      <input name="consent">
    </form>
  </body>
</html>
